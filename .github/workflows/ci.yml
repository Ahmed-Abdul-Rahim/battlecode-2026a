name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust crates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python tooling (ruff, pytest, codegen drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Feature schema codegen is current
        run: python ml/features/gen.py --check
      - name: Vendored crates in the bot are current
        run: python -m bctools.sync --check
      - run: pytest -q

  bot:
    name: Submission bot (wasm32-wasip1 build + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/main
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from bots/main/rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bots/main
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - name: Release build (as on the platform)
        run: cargo build --release
      - name: Wasm size
        run: ls -l target/wasm32-wasip1/release/*.wasm

  smoke:
    name: Smoke match vs starter (local engine)
    runs-on: ubuntu-latest
    needs: [bot]
    # Allowed to fail until cambc's Linux runner is confirmed on GitHub-hosted machines.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
        working-directory: bots/main
      - run: pip install -e ".[dev]"
      - name: One full match on one map, both sides
        run: |
          bctools run main baseline --maps ambush --out runs/ci
          python - <<'EOF'
          import json, pathlib, sys
          results = json.loads(pathlib.Path("runs/ci/results.json").read_text())
          print(json.dumps(results, indent=1))
          sys.exit(0 if all(r["winner"] for r in results) else 1)
          EOF
