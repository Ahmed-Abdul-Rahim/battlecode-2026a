# Host-side workspace for the SDK-free logic crates. Bots under bots/ are
# separate cambc workspaces (each declares its own [workspace]) that depend on
# these crates by path and build for wasm32-wasip1.
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["bots", "sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[workspace.lints.rust]
# deny, not forbid: the wasm32-only simd128 kernel in bc-brain/int8.rs allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
